name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install CUE and build CLI
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install cuelang.org/go/cmd/cue@v0.17.0
          go build -o "$RUNNER_TEMP/bin/homelab" ./cmd/homelab
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Generate deployment configuration
        run: |
          "$RUNNER_TEMP/bin/homelab" generate --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/generated" --hosts primary,secondary
      - name: Validate deployment configuration
        run: |
          set -eu
          sh -n ops/*.sh tools/*.sh
          cue fmt config/*.cue
          git diff --exit-code -- config
          git diff --check
          for host in primary secondary; do
            dir="$RUNNER_TEMP/generated/$host"
            docker compose --env-file "$dir/.env.example" -f "$dir/compose.yaml" config --format json > "$RUNNER_TEMP/$host.json"
            jq -e 'all(.services[]; .pull_policy == "never")' "$RUNNER_TEMP/$host.json" >/dev/null
            jq -r '.services[].image' "$RUNNER_TEMP/$host.json" | sort -u > "$RUNNER_TEMP/$host.compose-images"
            awk -F '|' 'NF && $1 !~ /^#/ { print $2 }' "$dir/images.txt" | sort -u > "$RUNNER_TEMP/$host.manifest-images"
            diff -u "$RUNNER_TEMP/$host.compose-images" "$RUNNER_TEMP/$host.manifest-images"
            while IFS= read -r app; do
              [ -n "$app" ] || continue
              test -f "$dir/$app.env.example"
              for key in DB_NAME DB_USER DB_PASSWORD DATABASE_URL; do
                grep -q "^${key}=" "$dir/$app.env.example"
              done
            done < "$dir/databases.txt"
          done
